<style>

.tr{display:flex;align-items:center;gap:10px}.avatar{width:46px;height:46px;border-radius:50%;padding:0;overflow:hidden;display:grid;place-items:center;background:linear-gradient(135deg,var(--g),var(--lime));color:#08140d;font-weight:800;font-size:19px;box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px rgba(126,224,160,.55);transition:transform .15s}.avatar:active{transform:scale(.93)}.avatar img{width:100%;height:100%;object-fit:cover;display:block}.avatar.lg{width:104px;height:104px;font-size:42px;margin:0 auto 14px;box-shadow:0 0 0 3px #121b16,0 0 0 5px rgba(126,224,160,.55)}.chip-s{padding:7px 11px}

.it{font-weight:600}.im{color:var(--mut);font-size:13px;margin-top:2px}
.x{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.06);color:var(--mut);display:grid;place-items:center;flex:none}

.input{width:100%;padding:13px 14px;border-radius:14px;background:rgba(0,0,0,.28);border:1px solid var(--line);font-size:16px;outline:0;transition:border .15s,box-shadow .15s;-webkit-appearance:none}
.input:focus{border-color:rgba(126,224,160,.55);box-shadow:0 0 0 3px rgba(126,224,160,.14)}

.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.fld{margin-bottom:12px}

.pill{position:fixed;left:50%;bottom:calc(76px + var(--sab));transform:translate(-50%,30px);opacity:0;pointer-events:none;z-index:30;display:flex;align-items:center;gap:10px;padding:10px 12px 10px 18px;border-radius:99px;background:rgba(24,34,28,.92);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid rgba(126,224,160,.3);box-shadow:0 12px 30px -8px #000;transition:all .3s;font-weight:700;white-space:nowrap}
.pill.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}.pill b{font-size:20px;font-variant-numeric:tabular-nums;color:var(--g);min-width:52px}.pill .btn{padding:7px 11px;font-size:13px}
#toast{position:fixed;left:16px;right:16px;max-width:420px;margin:auto;top:calc(var(--sat) + 10px);z-index:50;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 16px;border-radius:16px;background:#26352b;border:1px solid var(--line);font-weight:600;opacity:0;transform:translateY(-12px);pointer-events:none;transition:all .25s}
#toast.on{opacity:1;transform:none;pointer-events:auto}#toast button{color:var(--g);font-weight:800}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--card);border:1px solid var(--line);padding:3px;border-radius:13px;margin-bottom:14px}
.seg button{padding:9px;border-radius:10px;font-weight:700;color:var(--mut);transition:all .2s}.seg button.on{background:var(--card2);color:var(--text);box-shadow:0 1px 6px #0006}
.chip.on{background:rgba(126,224,160,.16);border-color:rgba(126,224,160,.5);color:var(--g)}.chip{flex:none}
.chips.sc{flex-wrap:nowrap;overflow-x:auto;margin-right:-18px;padding-right:18px;scrollbar-width:none}.chips.sc::-webkit-scrollbar{display:none}
.btn.on{background:var(--g);color:#08140d}.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;text-align:center}.kv b{display:block;font-size:18px}.kv span{font-size:12px;color:var(--mut)}
.cht{width:100%;height:auto;display:block;margin-top:10px}.cht text{fill:var(--mut);font-size:9px;font-weight:600}
.note{color:var(--mut);font-size:12px;text-align:center;margin:18px 10px 0}
@media(max-width:380px){.hero{flex-direction:column}.sl{grid-template-columns:22px 1fr 1fr 40px 26px;gap:6px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

${v.length>1?`<polygon points="${P[0][0]},${H-b} ${L} ${P[P.length-1][0]},${H-b}" fill="url(#cg)"/><polyline points="${L}" fill="none" stroke="#7ee0a0" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`:''}
${P.map((p,i)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${i===P.length-1?5:3}" fill="${i===P.length-1?'#c9f27d':'#7ee0a0'}"/>`).join('')}
<text x="${l}" y="${H-6}">${sd(ks[0])}</text>${ks.length>1?`<text x="${W_-r}" y="${H-6}" text-anchor="end">${sd(ks[ks.length-1])}</text>`:''}</svg>`}
function rSeg(){$('#hSeg').innerHTML=[['log','Log'],['prog','Progress']].map(([v,n])=>`<button class="${hv===v?'on':''}" data-a="hv" data-v="${v}">${n}</button>`).join('')}
function rProg(){$('#hLog').style.display=hv==='log'?'':'none';$('#hProg').style.display=hv==='prog'?'':'none';rData();if(hv!=='prog')return;
const L=logged();if(!L.length){$('#hProg').innerHTML='<div class="card"><div class="empty">Log sets with weight to see progress charts and personal records here.</div></div>';return}
if(!L.some(x=>x[0]===pe))pe=L[0][0];const S=series(pe),v=S.map(x=>x[pm]),f=v[0],la=v[v.length-1],df=la-f;
const prs=L.map(([n])=>{let bw=null,be=0,bd='';series(n).forEach(x=>{if(!bw||x.w>=bw){bw=x.w;bd=x.k}be=Math.max(be,x.r)});const top=Object.values(state.days).flatMap(d=>d.exercises.filter(e=>e.name===n).flatMap(okSets)).filter(s=>s.weight===bw).sort((a,b)=>b.reps-a.reps)[0];return{n,bw,reps:top?top.reps:0,be,bd}}).sort((a,b)=>b.bd.localeCompare(a.bd));
$('#hProg').innerHTML=`<div class="card"><div class="sh"><h2>Exercise progress</h2></div><div class="chips sc" style="margin-top:0">${L.map(([n])=>`<button class="chip ${n===pe?'on':''}" data-a="pex" data-n="${esc(n)}">${esc(n)}</button>`).join('')}</div>
<div class="seg" style="margin:14px 0 0">${Object.keys(ML).map(m=>`<button class="${pm===m?'on':''}" data-a="pmet" data-m="${m}">${ML[m]}</button>`).join('')}</div>${chart(v,S.map(x=>x.k))}
<div class="kv"><div><b>${r1(Math.max(...v))} kg</b><span>Best</span></div><div><b>${S.length}</b><span>Sessions</span></div><div><b style="color:${df>0?'var(--g)':df<0?'var(--rose)':'var(--text)'}">${S.length>1?(df>0?'+':'')+r1(df)+' kg':'–'}</b><span>Since first</span></div></div>
${pm==='r'?'<p class="sub" style="margin:12px 0 0;text-align:center">Estimated one-rep max (Epley formula). Most accurate for sets of 10 reps or fewer.</p>':''}</div>
<div class="card"><div class="sh"><h2>Personal records</h2><span class="sub">${prs.length} lifts</span></div>${prs.map(p=>`<div class="item"><div><div class="it">${esc(p.n)}</div><div class="im">${sd(p.bd)} · est. 1RM ${r1(p.be)} kg</div></div><b>${r1(p.bw)} kg × ${p.reps}</b></div>`).join('')}</div>`}

const A={
hv:d=>{hv=d.v;render()},pex:d=>{pe=d.n;render()},pmet:d=>{pm=d.m;render()},heat:()=>{heat=!heat;rHeat()},
repeat:d=>{W().exercises=D(d.k).exercises.map(e=>({name:e.name,sets:cp(e.sets)}));save();toast('Workout loaded')},
useT:d=>{const t=state.templates[d.i];W().exercises=t.exercises.map(e=>{const l=last(e.name);return{name:e.name,sets:l&&l.length?cp(l):Array.from({length:e.n||3},()=>({reps:10,weight:0,done:false}))}});save();toast(t.name+' loaded')},
tplSheet:()=>sheet('<h2>Save as template</h2><div class="fld"><label class="fl">Template name</label><input class="input" id="tn" maxlength="30" placeholder="e.g. Push day"></div><button class="btn p w" data-a="saveTpl">Save template</button>'),
saveTpl(){const n=tn.value.trim();if(!n){tn.focus();return}state.templates.push({name:n,exercises:D().exercises.map(e=>({name:e.name,n:e.sets.length}))});save();close();toast('Template saved')},
rmT:d=>destroy(()=>state.templates.splice(d.i,1),'Template deleted'),
addMeal:d=>{W().foods.push({...state.meals[d.i]});save();toast(state.meals[d.i].name+' added')},rmMeal:d=>destroy(()=>state.meals.splice(d.i,1),'Meal deleted'),
copyY:()=>{const yf=D(prevK()).foods;destroy(()=>W().foods.push(...yf.map(f=>({...f}))),'Copied yesterday’s meals')},
restore:d=>{const x=snaps()[d.i];if(x&&confirm('Restore the snapshot from '+x.d+'? Current data is saved as a snapshot first.')){autoSnap(true);state=norm(JSON.parse(x.data));save();toast('Snapshot restored')}},
tab:d=>{tab=d.t;scrollTo(0,0);render()},day:d=>{cur=d.k;render()},open:d=>{cur=d.k;tab='home';scrollTo(0,0);render()},
wk:d=>{const x=pd(cur);x.setDate(x.getDate()+7*d.n);cur=iso(x);render()},muscle:d=>{muscle=d.m;rWorkout()},
add:d=>{const p=last(d.n);W().exercises.push({name:d.n,sets:p&&p.length?p.map(s=>({reps:s.reps,weight:s.weight,done:false})):[{reps:10,weight:0,done:false}]});save();toast(d.n+' added')},
addSet:d=>{const e=W().exercises[d.i],l=e.sets[e.sets.length-1]||{reps:10,weight:0};e.sets.push({reps:l.reps,weight:l.weight,done:false});save()},
rmSet:d=>destroy(()=>W().exercises[d.i].sets.splice(d.j,1),'Set removed'),rmEx:d=>destroy(()=>W().exercises.splice(d.i,1),'Exercise removed'),
done:d=>{const s=W().exercises[d.i].sets[d.j];s.done=!s.done;save();s.done&&rest(90)},
rest:d=>rest(num(d.s)),restStop:()=>{clearInterval(rt);rend=0;$('#pill').classList.remove('on')},
rmFood:d=>destroy(()=>W().foods.splice(d.i,1),'Food removed'),undo:()=>{if(snap){state=norm(JSON.parse(snap));snap=null;save();$('#toast').classList.remove('on')}},close,
profileSheet(){tmpPhoto=state.profile.photo;const p=state.profile;sheet(`<h2 style="text-align:center">Your profile</h2><button class="avatar lg" id="pv" data-a="pickPhoto" aria-label="Choose photo">${avatar()}</button><div class="two" style="margin-bottom:16px"><button class="btn ghost sm" data-a="pickPhoto">Choose photo</button><button class="btn ghost sm danger" data-a="rmPhoto">Remove photo</button></div><div class="fld"><label class="fl">Your name</label><input class="input" id="pn" maxlength="30" placeholder="What should Ascend call you?" value="${esc(p.name)}"></div><button class="btn p w" data-a="saveProfile">Save profile</button>`)},
pickPhoto:()=>$('#pic').click(),
rmPhoto(){tmpPhoto='';pvRefresh()},
saveProfile(){state.profile={name:pn.value.trim().slice(0,30),photo:tmpPhoto};save();close();toast('Profile saved')},
foodSheet(){const c={};Object.keys(state.days).sort().forEach(k=>state.days[k].foods.forEach(f=>{const n=f.name.toLowerCase();c[n]=c[n]||{f,n:0};c[n].f=f;c[n].n++}));recent=state.meals.concat(Object.values(c).sort((a,b)=>b.n-a.n).slice(0,8).map(x=>x.f)).filter((f,i,a)=>a.findIndex(y=>y.name.toLowerCase()===f.name.toLowerCase())===i).slice(0,12);
sheet(`<h2>Add food</h2>${recent.length?`<div class="sub">Quick add</div><div class="chips" style="margin:8px 0 16px">${recent.map((f,i)=>`<button class="chip" data-a="fill" data-i="${i}">${esc(f.name)}</button>`).join('')}</div>`:''}<div class="fld"><label class="fl">Food / meal</label><input class="input" id="fn" placeholder="e.g. Chicken & rice"></div><div class="two">${ip('fk','Calories (kcal)','auto','numeric')}${ip('fp','Protein (g)','0')}${ip('fc','Carbs (g)','0')}${ip('ff','Fat (g)','0')}</div><label class="sub" style="display:flex;gap:10px;align-items:center;margin:0 0 14px"><input type="checkbox" id="fs" style="width:20px;height:20px;accent-color:#7ee0a0"> Save to my meals for one-tap reuse</label><button class="btn p w" data-a="saveFood">Add to ${cur===iso(new Date())?'today':'this day'}</button><p class="sub" style="text-align:center;margin:10px 0 0">Leave calories empty to calculate from macros.</p>`)},
fill:d=>{const f=recent[d.i];fn.value=f.name;fk.value=f.kcal;fp.value=f.p;fc.value=f.c;ff.value=f.f},
saveFood(){const n=fn.value.trim();if(!n){fn.focus();return}let p=num(fp.value),c=num(fc.value),f=num(ff.value),k=num(fk.value);if(!k)k=Math.round(p*4+c*4+f*9);W().foods.push({name:n,kcal:k,p,c,f});if(fs.checked&&!state.meals.some(m=>m.name.toLowerCase()===n.toLowerCase()))state.meals.push({name:n,kcal:k,p,c,f});save();close()},
goalSheet(){const g=state.goals;sheet(`<h2>Daily targets</h2><div class="two">${ip('gc','Calories (kcal)','2400','numeric',g.cal)}${ip('gp','Protein (g)','150','numeric',g.p)}${ip('gcb','Carbs (g)','250','numeric',g.c)}${ip('gf','Fat (g)','70','numeric',g.f)}</div><div class="sub" id="gh" style="margin-bottom:14px"></div><button class="btn p w" data-a="saveGoals">Save targets</button>`);gh.textContent='Macros add up to '+fmt(g.p*4+g.c*4+g.f*9)+' kcal'},
saveGoals(){state.goals={cal:num(gc.value),p:num(gp.value),c:num(gcb.value),f:num(gf.value)};save();close()},
weightSheet(){const w=weights().pop();sheet(`<h2>Log body weight</h2>${ip('wv','Weight (kg)','e.g. 72.4','decimal',w?w.kg:'')}<button class="btn p w" data-a="saveWeight">Save for ${pd(cur).toLocaleDateString('en-US',{month:'short',day:'numeric'})}</button>`)},
saveWeight(){const v=num(wv.value.replace(',','.'));if(v<=0){wv.focus();return}const e=state.weights.find(x=>x.date===cur);e?e.kg=v:state.weights.push({date:cur,kg:v});save();close()},
customSheet(){sheet(`<h2>Custom ${muscle} exercise</h2><div class="fld"><input class="input" id="cx" placeholder="Exercise name"></div><button class="btn p w" data-a="saveCustom">Add exercise</button>`)},
saveCustom(){const n=cx.value.trim();if(!n)return;(state.custom[muscle]=state.custom[muscle]||[]).push(n);A.add({n});close()},
async export(){const f=new File([JSON.stringify(state,null,2)],'ascend-backup-'+iso(new Date())+'.json',{type:'application/json'});try{if(navigator.canShare?.({files:[f]})){await navigator.share({files:[f],title:'Ascend backup'});bkDone();return}}catch(e){if(e.name==='AbortError')return}const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;a.click();bkDone();setTimeout(()=>URL.revokeObjectURL(a.href),4000)},
import:()=>$('#imp').click()};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t&&A[t.dataset.a]&&!(t.id==='ov'&&e.target!==t))A[t.dataset.a](t.dataset);const m=e.target.closest('[data-muscle]');if(m)A.muscle({m:m.dataset.muscle})});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.k){W().exercises[t.dataset.i].sets[t.dataset.j][t.dataset.k]=num(t.value.replace(',','.'));save(false);rWSum();rHome();rHist()}});
$('#wNote').addEventListener('input',e=>{if(!e.target.value&&!state.days[cur])return;W().note=e.target.value;save(false)});
$('#imp').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{const j=JSON.parse(await f.text());if(!j.days||!j.goals)throw Error('not an Ascend backup');if(!confirm('Replace all data on this device with the backup?'))return;autoSnap(true);state=norm(j);save();toast('Backup imported')}catch(err){toast('Import failed: '+err.message)}});
$('#pic').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const img=new Image(),u=URL.createObjectURL(f);img.onload=()=>{const n=Math.min(img.width,img.height),c=document.createElement('canvas');c.width=c.height=320;c.getContext('2d').drawImage(img,(img.width-n)/2,(img.height-n)/2,n,n,0,0,320,320);tmpPhoto=c.toDataURL('image/jpeg',.85);URL.revokeObjectURL(u);pvRefresh()};img.onerror=()=>toast('Could not read that image');img.src=u});
autoSnap();navigator.storage?.persist?.();render();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
